app = "ichigo-chess"
primary_region = "sjc"

[http_service]
  internal_port = 8080
  auto_start_machines   = true
  auto_stop_machines    = false  # keep it warm so edge never routes to a cold app
  min_machines_running  = 0     # <-- CORRECTED THIS LINE
    
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    method = "get"
    path = "/health" 
    interval = "5s"
    timeout  = "1s"
    grace_period = "8s"

[[mounts]]
  source = "data"
  destination = "/app/data"