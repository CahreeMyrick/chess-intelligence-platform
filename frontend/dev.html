<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Experimental developer frontend for Ichigo Chess.">
  <title>Ichigo Chess — Dev Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/chessboardjs-1.0.0/css/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/play.css">
  <link rel="stylesheet" href="/css/dev.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">IG</div>
      <div>
        <div class="brand-name">ICHIGO</div>
        <div class="brand-sub">chess engine</div>
      </div>
    </div>
    <nav aria-label="Primary navigation">
      <a href="/" class="nav-link">Play</a>
      <a href="/puzzles" class="nav-link">Puzzles</a>
      <a href="/dev" class="nav-link active" aria-current="page">Dev Lab</a>
    </nav>
    <div class="topbar-end">
      <span class="dev-badge">🧪 Experimental Front-End</span>
    </div>
  </header>

  <main class="dev-page-layout">
    <!-- Left Column: Board and Match Controls -->
    <section class="dev-board-section" aria-label="Chess Playground">
      <div class="card">
        <!-- Top Player Strip -->
        <div class="player-strip">
          <div class="player-info">
            <div class="avatar engine" id="topAvatar" aria-hidden="true">⚙</div>
            <div>
              <div class="player-name" id="topPlayerName">Opponent</div>
              <div class="player-role" id="topPlayerRole">Bot</div>
            </div>
          </div>
          <div class="clock" id="topClock" aria-label="Top clock">05:00</div>
        </div>

        <!-- Board -->
        <div class="board-wrap">
          <div id="devBoard" aria-label="Interactive chess board"></div>
        </div>

        <!-- Bottom Player Strip -->
        <div class="player-strip">
          <div class="player-info">
            <div class="avatar human" id="bottomAvatar" aria-hidden="true">♙</div>
            <div>
              <div class="player-name" id="bottomPlayerName">You</div>
              <div class="player-role" id="bottomPlayerRole">White</div>
            </div>
          </div>
          <div class="clock" id="bottomClock" aria-label="Bottom clock">05:00</div>
        </div>

        <!-- Status Banner -->
        <div id="statusBanner" class="game-banner" role="status">Ready</div>

        <!-- Quick Board Action Buttons -->
        <div class="dev-actions-grid">
          <button class="btn btn-primary btn-sm" id="newGameBtn" type="button">✦ New Game</button>
          <button class="btn btn-ghost btn-sm" id="undoBtn" type="button">↩ Undo</button>
          <button class="btn btn-ghost btn-sm" id="flipBtn" type="button">⇅ Flip</button>
          <button class="btn btn-ghost btn-sm" id="hintBtn" type="button">💡 Hint</button>
          <button class="btn btn-ghost btn-sm" id="engineMoveBtn" type="button">⚡ Engine Move</button>
          <button class="btn btn-danger btn-sm" id="endGameBtn" type="button">⏹ End Game</button>
        </div>
      </div>
    </section>

    <!-- Right Column: Experimentation & Developer Controls -->
    <aside class="dev-controls-section" aria-label="Developer Tools">
      
      <!-- Experiment Settings Card -->
      <div class="dev-card">
        <div class="dev-card-header">
          <span class="dev-card-title">⚙ Match Configuration</span>
          <div class="status-inline" role="status">
            <span id="thinkingIndicator" class="spin" style="display:none" aria-hidden="true"></span>
            <span id="thinkingText" class="status-text"></span>
          </div>
        </div>

        <div class="dev-card-body">
          <!-- Game Mode Selector -->
          <div class="dev-field">
            <label class="dev-label" for="gameMode">Game Mode</label>
            <select id="gameMode" class="dev-select">
              <option value="pvp">Player vs Player (Pass &amp; Play)</option>
              <option value="pve" selected>Player vs Engine (Ichigo)</option>
            </select>
          </div>

          <!-- Timer Mode Selector -->
          <div class="dev-field">
            <label class="dev-label" for="timerMode">Timer Option</label>
            <select id="timerMode" class="dev-select">
              <option value="none" selected>No Time (Casual / Untimed)</option>
              <option value="timed">Timed Game (Clock enabled)</option>
            </select>
          </div>

          <!-- Time Control Presets -->
          <div class="dev-field" style="display:none;">
            <label class="dev-label" for="timePreset">Time Control</label>
            <select id="timePreset" class="dev-select">
              <option value="1+0">1 min (Bullet)</option>
              <option value="3+0">3 min (Blitz)</option>
              <option value="3+2">3 min + 2s (Blitz)</option>
              <option value="5+0" selected>5 min (Rapid)</option>
              <option value="10+0">10 min (Rapid)</option>
              <option value="custom">Custom...</option>
            </select>
          </div>

          <!-- Custom Time Inputs -->
          <div id="customTimeRow" class="custom-time-row" style="display:none;">
            <div class="dev-field">
              <label class="dev-label" for="customMinutes">Minutes</label>
              <input id="customMinutes" class="dev-input" type="number" min="1" max="180" value="5">
            </div>
            <div class="dev-field">
              <label class="dev-label" for="customIncrement">Increment (sec)</label>
              <input id="customIncrement" class="dev-input" type="number" min="0" max="60" value="0">
            </div>
          </div>

          <!-- Side Picker (for PvE) -->
          <div id="engineSideWrapper" class="dev-field">
            <label class="dev-label" for="sideSelect">Play As</label>
            <select id="sideSelect" class="dev-select">
              <option value="w" selected>White (First move)</option>
              <option value="b">Black (Second move)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Engine Tuning (for PvE) -->
      <div id="engineSettingsCard" class="dev-card">
        <div class="dev-card-header">
          <span class="dev-card-title">🤖 Engine Parameters</span>
        </div>
        <div class="dev-card-body">
          <div class="dev-field">
            <div class="dev-field-inline">
              <label class="dev-label" for="engineDepth">Search Depth</label>
              <span id="depthLabel" class="dev-val-badge">2</span>
            </div>
            <div class="dev-range-wrap">
              <input id="engineDepth" class="dev-range" type="range" min="1" max="12" step="1" value="2">
            </div>
          </div>

          <div class="dev-field">
            <div class="dev-field-inline">
              <label class="dev-label" for="engineMovetime">Move Time Limit</label>
              <span id="movetimeLabel" class="dev-val-badge">500 ms</span>
            </div>
            <div class="dev-range-wrap">
              <input id="engineMovetime" class="dev-range" type="range" min="50" max="3000" step="50" value="500">
            </div>
          </div>
        </div>
      </div>

      <!-- PvP Specific Tuning -->
      <div id="pvpSettingsCard" class="dev-card" style="display:none;">
        <div class="dev-card-header">
          <span class="dev-card-title">👥 PvP Options</span>
        </div>
        <div class="dev-card-body">
          <label class="dev-checkbox-label">
            <input type="checkbox" id="autoFlipCheck">
            <span>Auto-flip board on turn change (for pass &amp; play)</span>
          </label>
        </div>
      </div>

      <!-- FEN & Setup Card -->
      <div class="dev-card">
        <div class="dev-card-header">
          <span class="dev-card-title">📋 Position &amp; FEN</span>
        </div>
        <div class="dev-card-body">
          <div class="fen-box">
            <input id="fenInput" class="dev-input" type="text" placeholder="Paste FEN here..." value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
            <button class="btn btn-ghost btn-sm" id="copyFenBtn" type="button">Copy</button>
            <button class="btn btn-ghost btn-sm" id="loadFenBtn" type="button">Load</button>
          </div>
        </div>
      </div>

      <!-- Move History -->
      <div class="dev-card">
        <div class="dev-card-header">
          <span class="dev-card-title">📜 Move History</span>
        </div>
        <div id="movesGrid" class="dev-moves-grid">
          <span class="moves-empty">No moves yet</span>
        </div>
      </div>

      <!-- Dev Engine Console -->
      <div class="dev-card">
        <div class="dev-card-header">
          <span class="dev-card-title">💻 Dev &amp; Engine Console</span>
        </div>
        <div id="devLog" class="dev-log-console" aria-live="polite">[Dev Lab initialized] Ready for experimentation.</div>
      </div>

    </aside>
  </main>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="/chessboardjs-1.0.0/js/chessboard-1.0.0.min.js"></script>
  <script type="module" src="/js/dev/dev.mjs"></script>
</body>
</html>
