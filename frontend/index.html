<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play chess against the Ichigo engine.">
  <title>Ichigo Chess</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./chessboardjs-1.0.0/css/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/play.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">IG</div>
      <div>
        <div class="brand-name">ICHIGO</div>
        <div class="brand-sub">chess engine</div>
      </div>
    </div>
    <nav aria-label="Primary navigation">
      <a href="/" class="nav-link active" aria-current="page">Play</a>
      <a href="/puzzles" class="nav-link">Puzzles</a>
      <a href="/dev" class="nav-link">Dev Lab</a>
    </nav>
    <div class="topbar-end">
      <button class="btn btn-primary btn-sm" id="new" type="button">+ New Game</button>
    </div>
  </header>

  <main class="page">
    <section class="main-col" aria-label="Chess game">
      <div class="card">
        <div class="card-header">
          <span class="card-label">Game</span>
          <div class="controls-row">
            <div class="field">
              <label for="playAs">Side</label>
              <select id="playAs">
                <option value="w" selected>White</option>
                <option value="b">Black</option>
              </select>
            </div>
            <div class="field hidden">
              <label for="difficulty">Depth</label>
              <input id="difficulty" type="range" min="1" max="5" step="1" value="2">
              <span id="diffLabel">2/5</span>
            </div>
          </div>
        </div>

        <div class="player-strip">
          <div class="player-info">
            <div class="avatar engine" aria-hidden="true">♟</div>
            <div><div class="player-name">Ichigo</div><div class="player-role">Engine</div></div>
          </div>
          <div class="clock" id="bClock" aria-label="Black clock">05:00</div>
        </div>

        <div class="board-wrap"><div id="board" aria-label="Chess board"></div></div>

        <div class="player-strip">
          <div class="player-info">
            <div class="avatar human" aria-hidden="true">♙</div>
            <div><div class="player-name">You</div><div class="player-role">Guest</div></div>
          </div>
          <div class="clock" id="wClock" aria-label="White clock">05:00</div>
        </div>

        <div id="gameBanner" class="game-banner" role="status"></div>
        <div class="board-actions">
          <button class="btn btn-ghost btn-sm" id="flip" type="button">⇅ Flip</button>
          <button class="btn btn-ghost btn-sm" id="hintBtn" type="button">💡 Hint</button>
          <button class="btn btn-ghost btn-sm hidden" id="engineMove" type="button">Engine Move</button>
          <button class="btn btn-danger btn-sm" id="finish" type="button">End Game</button>
        </div>
      </div>

      <div class="hidden" aria-hidden="true">
        <input id="ms" type="number" value="500" min="50" step="50">
        <input id="depth" type="number" min="1" step="1">
      </div>
    </section>

    <aside class="side-col" aria-label="Game details">
      <div class="card">
        <div class="card-header">
          <span class="card-label">Moves</span>
          <div class="status-inline" role="status" aria-live="polite">
            <span id="spinner" class="spin" style="display:none" aria-hidden="true"></span>
            <span id="thinkingText" class="status-text"></span>
          </div>
        </div>
        <div id="movesGrid" class="moves-grid"><span class="moves-empty">No moves yet</span></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-label">Engine Log</span></div>
        <div id="log" class="engine-log" aria-live="polite">—</div>
      </div>
    </aside>
  </main>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="./chessboardjs-1.0.0/js/chessboard-1.0.0.min.js"></script>
  <script type="module" src="./js/play/play.mjs"></script>
</body>
</html>
