services:
  - type: web
    name: ichigo
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENGINE_PATH
        value: /app/engine/chess_uci_bb
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
