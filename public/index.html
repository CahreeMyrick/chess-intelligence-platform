<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ichigo Chess</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./chessboardjs-1.0.0/css/chessboard-1.0.0.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #080c0f;
  --surface:     #0e1419;
  --surface-2:   #131b22;
  --border:      #1e2830;
  --border-2:    #263040;
  --teal:        #2dd4bf;
  --teal-dim:    #14b8a6;
  --teal-glow:   rgba(45,212,191,.12);
  --teal-subtle: rgba(45,212,191,.06);
  --text:        #e2e8f0;
  --text-2:      #94a3b8;
  --text-3:      #4b5a6a;
  --danger:      #f87171;
  --last-move:   rgba(45,212,191,.18);
  --hint:        rgba(251,191,36,.55);
  --mono:        'IBM Plex Mono', 'Courier New', monospace;
  --sans:        'IBM Plex Sans', system-ui, sans-serif;
  --r:           6px;
}

html, body { height: 100%; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

button, select, input { font: inherit; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

/* ── TOP BAR ── */
.topbar {
  height: 52px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 20;
  gap: 16px;
}

.brand { display: flex; align-items: center; gap: 10px; margin-right: 24px; }

.brand-icon {
  width: 28px; height: 28px;
  border-radius: var(--r);
  background: var(--teal);
  color: #030b09;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .04em;
  flex-shrink: 0;
}

.brand-name {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .08em;
}

.brand-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: .04em;
  margin-top: 1px;
}

nav { display: flex; gap: 2px; flex: 1; }

.nav-link {
  padding: 6px 13px;
  border-radius: var(--r);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  text-decoration: none;
  transition: background .15s, color .15s;
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.active {
  background: var(--teal-subtle);
  color: var(--teal);
  border: 1px solid rgba(45,212,191,.2);
}

.topbar-end { margin-left: auto; }

/* ── LAYOUT ── */
.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 20px;
  display: grid;
  grid-template-columns: minmax(0,1fr) 288px;
  gap: 20px;
  align-items: start;
}

@media (max-width: 900px) { .page { grid-template-columns: 1fr; } }

.main-col, .side-col { display: flex; flex-direction: column; gap: 14px; }

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-wrap: wrap;
  min-height: 46px;
}

.card-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text-3);
}

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: none;
  border-radius: var(--r);
  padding: 7px 13px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all .15s;
  white-space: nowrap;
}

.btn-primary {
  background: var(--teal);
  color: #030b09;
  font-weight: 600;
}
.btn-primary:hover { background: var(--teal-dim); box-shadow: 0 0 16px var(--teal-glow); }

.btn-ghost {
  background: transparent;
  color: var(--text-2);
  border: 1px solid var(--border-2);
}
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }

.btn-danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid rgba(248,113,113,.28);
}
.btn-danger:hover { background: rgba(248,113,113,.07); }

.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ── CONTROLS ── */
.controls-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.field {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text-2);
}

select {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border-2);
  border-radius: var(--r);
  padding: 4px 8px;
  font-size: 12px;
  outline: none;
  cursor: pointer;
}
select:focus { border-color: rgba(45,212,191,.4); }

input[type="range"] { accent-color: var(--teal); width: 76px; }
input[type="number"] {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border-2);
  border-radius: var(--r);
  padding: 4px 8px;
  width: 70px;
}

/* ── PLAYER STRIPS ── */
.player-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  gap: 12px;
  background: var(--surface-2);
}

.player-info { display: flex; align-items: center; gap: 10px; }

.avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--border-2);
  border: 1px solid var(--border-2);
  display: grid;
  place-items: center;
  font-size: 15px;
  flex-shrink: 0;
}

.avatar.engine { background: rgba(45,212,191,.1); border-color: rgba(45,212,191,.28); }
.avatar.human  { background: rgba(30,110,250,.1); border-color: rgba(30,110,250,.28); }

.player-name { font-size: 13px; font-weight: 600; }
.player-role {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .05em;
}

.clock {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: .07em;
  padding: 5px 10px;
  border-radius: var(--r);
  background: var(--surface);
  border: 1px solid var(--border);
  min-width: 70px;
  text-align: center;
  transition: color .3s, border-color .3s, box-shadow .3s;
}
.clock.active { color: var(--teal); border-color: rgba(45,212,191,.32); box-shadow: 0 0 10px rgba(45,212,191,.08); }
.clock.low    { color: var(--danger); border-color: rgba(248,113,113,.32); box-shadow: 0 0 10px rgba(248,113,113,.08); }

/* ── BOARD ── */
.board-wrap {
  display: flex;
  justify-content: center;
  padding: 14px 16px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

#board { width: min(556px, 88vw); }

/* Warm square overrides */
.white-1e1d7 { background: #c8b07a !important; }
.black-3c85d { background: #7a5032 !important; }

.notation-322f9 {
  font-family: var(--mono) !important;
  font-size: 9px !important;
  opacity: .45 !important;
}

.board-disabled { pointer-events: none; opacity: .6; }

#board .square-55d63.last-move   { box-shadow: inset 0 0 0 9999px var(--last-move); }
#board .square-55d63.hint-square { box-shadow: inset 0 0 0 9999px var(--hint); }

/* ── BOARD ACTIONS ── */
.board-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 11px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}

/* ── GAME BANNER ── */
.game-banner {
  display: none;
  margin: 0 16px 14px;
  padding: 9px 14px;
  border-radius: var(--r);
  background: rgba(45,212,191,.07);
  border: 1px solid rgba(45,212,191,.18);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--teal);
  letter-spacing: .03em;
  animation: bannerIn .3s ease;
}

@keyframes bannerIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── STATUS ── */
.status-inline {
  display: flex;
  align-items: center;
  gap: 7px;
}

.spin {
  width: 11px; height: 11px;
  border: 2px solid var(--border-2);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.status-text {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-2);
  letter-spacing: .04em;
}

/* ── MOVE GRID ── */
.moves-grid {
  padding: 10px 14px;
  max-height: 260px;
  overflow-y: auto;
  display: grid;
  grid-template-columns: 28px 1fr 1fr;
  gap: 1px 0;
  font-family: var(--mono);
  font-size: 12px;
}

.move-num { color: var(--text-3); padding: 3px 0; user-select: none; }
.move-cell {
  color: var(--text-2);
  padding: 3px 6px;
  border-radius: 3px;
  transition: background .1s, color .1s;
}
.move-cell:hover { background: var(--surface-2); color: var(--text); }
.move-cell.latest { color: var(--teal); }

/* ── ENGINE LOG ── */
.engine-log {
  padding: 10px 14px;
  max-height: 160px;
  min-height: 60px;
  overflow-y: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.65;
}

.hidden { display: none !important; }

/* ── PAGE ANIMATION ── */
.page > * {
  animation: fadeUp .35s ease both;
}
.page > *:nth-child(2) { animation-delay: .07s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-icon">IG</div>
    <div>
      <div class="brand-name">ICHIGO</div>
      <div class="brand-sub">chess engine</div>
    </div>
  </div>

  <nav>
    <a href="/"        class="nav-link active">Play</a>
    <a href="/puzzles" class="nav-link">Puzzles</a>
  </nav>

  <div class="topbar-end">
    <button class="btn btn-primary btn-sm" id="new">+ New Game</button>
  </div>
</header>

<main class="page">

  <!-- ════ MAIN COLUMN ════ -->
  <section class="main-col">
    <div class="card">

      <div class="card-header">
        <span class="card-label">Game</span>
        <div class="controls-row">
          <div class="field">
            <label for="playAs">Side</label>
            <select id="playAs">
              <option value="w" selected>White</option>
              <option value="b">Black</option>
            </select>
          </div>
          <div class="field hidden">
            <label for="difficulty">Depth</label>
            <input id="difficulty" type="range" min="1" max="5" step="1" value="2">
            <span id="diffLabel" style="font-family:var(--mono);font-size:11px;color:var(--teal);">2/5</span>
          </div>
        </div>
      </div>

      <!-- Opponent (top) -->
      <div class="player-strip">
        <div class="player-info">
          <div class="avatar engine">♟</div>
          <div>
            <div class="player-name">Ichigo</div>
            <div class="player-role">Engine</div>
          </div>
        </div>
        <div class="clock" id="bClock">05:00</div>
      </div>

      <!-- Board -->
      <div class="board-wrap">
        <div id="board"></div>
      </div>

      <!-- Player (bottom) -->
      <div class="player-strip">
        <div class="player-info">
          <div class="avatar human">♙</div>
          <div>
            <div class="player-name">You</div>
            <div class="player-role">Guest</div>
          </div>
        </div>
        <div class="clock active" id="wClock">05:00</div>
      </div>

      <div id="gameBanner" class="game-banner"></div>

      <div class="board-actions">
        <button class="btn btn-ghost btn-sm" id="flip">⇅ Flip</button>
        <button class="btn btn-ghost btn-sm" id="hintBtn">💡 Hint</button>
        <button class="btn btn-ghost btn-sm hidden" id="engineMove">Engine Move</button>
        <button class="btn btn-danger btn-sm" id="finish">End Game</button>
      </div>

    </div>

    <div class="hidden">
      <input id="ms"    type="number" value="500" min="50" step="50">
      <input id="depth" type="number" min="1" step="1">
    </div>
  </section>

  <!-- ════ SIDE COLUMN ════ -->
  <aside class="side-col">

    <div class="card">
      <div class="card-header">
        <span class="card-label">Moves</span>
        <div class="status-inline">
          <span id="spinner" class="spin" style="display:none"></span>
          <span id="thinkingText" class="status-text"></span>
        </div>
      </div>
      <div id="movesGrid" class="moves-grid">
        <span style="grid-column:1/-1;color:var(--text-3);font-size:11px;padding:3px 0;">No moves yet</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-label">Engine Log</span>
      </div>
      <div id="log" class="engine-log">—</div>
    </div>

  </aside>

</main>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="./chessboardjs-1.0.0/js/chessboard-1.0.0.min.js"></script>

<script>
  let board, boardArray, whiteAtBottom = true, turn = 'w';
  let moveList = [], started = false, currentGameId = null;
  let epTarget = null, hintMove = null;

  const boardDiv  = document.getElementById('board');
  const playAsSel = document.getElementById('playAs');
  const diffRange = document.getElementById('difficulty');
  const diffLabel = document.getElementById('diffLabel');
  const msEl      = document.getElementById('ms');
  const depthEl   = document.getElementById('depth');
  const spinner   = document.getElementById('spinner');
  const thinkText = document.getElementById('thinkingText');
  const wClock    = document.getElementById('wClock');
  const bClock    = document.getElementById('bClock');

  let clocks = { w: 5*60*1000, b: 5*60*1000 };
  let clockTimer = null;

  function log(s) {
    const el = document.getElementById('log');
    if (el.textContent === '—') el.textContent = '';
    el.textContent = s + '\n' + el.textContent;
  }

  function setThinking(on) {
    spinner.style.display = on ? 'inline-block' : 'none';
    thinkText.textContent = on ? 'Thinking…' : '';
  }

  function resetClocks() {
    clocks = { w:5*60*1000, b:5*60*1000 };
    updateClocks();
    if (clockTimer) clearInterval(clockTimer);
    clockTimer = setInterval(tick, 1000);
  }

  function tick() {
    clocks[turn] -= 1000;
    updateClocks();
    if (clocks[turn] <= 0) endGame({ result:(turn==='w'?'0-1':'1-0'), reason:'timeout' });
  }

  function updateClocks() {
    wClock.textContent = fmt(clocks.w);
    bClock.textContent = fmt(clocks.b);
    wClock.classList.toggle('active', turn === 'w');
    bClock.classList.toggle('active', turn === 'b');
    wClock.classList.toggle('low', clocks.w < 30000);
    bClock.classList.toggle('low', clocks.b < 30000);
  }

  function fmt(ms) {
    ms = Math.max(ms, 0);
    const s = Math.floor(ms/1000), m = Math.floor(s/60), r = s%60;
    return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
  }

  function setupStartBoardArray() {
    const empty = () => Array(8).fill(null);
    const back  = c => [{c,t:'r'},{c,t:'n'},{c,t:'b'},{c,t:'q'},{c,t:'k'},{c,t:'b'},{c,t:'n'},{c,t:'r'}];
    boardArray = [
      back('b'),
      Array(8).fill(null).map(()=>({c:'b',t:'p'})),
      empty(), empty(), empty(), empty(),
      Array(8).fill(null).map(()=>({c:'w',t:'p'})),
      back('w')
    ];
  }

  function rc2sq(x)    { return 'abcdefgh'[x.c] + (8-x.r); }
  function parseSq(id) { return { r:8-parseInt(id[1],10), c:id.charCodeAt(0)-97 }; }

  function pieceToBoardJs(p) {
    if (!p) return null;
    return p.c + {p:'P',n:'N',b:'B',r:'R',q:'Q',k:'K'}[p.t];
  }

  function boardArrayToPosition() {
    const pos = {};
    for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
      const p = boardArray[r][c];
      if (p) pos[rc2sq({r,c})] = pieceToBoardJs(p);
    }
    return pos;
  }

  function syncBoardPosition() {
    if (!board) return;
    board.position(boardArrayToPosition(), false);
    updateMoveList();
    clearSquareHighlights();
    highlightLastMove();
    highlightHint();
    updateClocks();
  }

  function updateMoveList() {
    const grid = document.getElementById('movesGrid');
    if (!moveList.length) {
      grid.innerHTML = '<span style="grid-column:1/-1;color:var(--text-3);font-size:11px;padding:3px 0;">No moves yet</span>';
      return;
    }
    let html = '';
    for (let i=0; i<moveList.length; i+=2) {
      const num = Math.floor(i/2)+1;
      const wm = moveList[i]||'', bm = moveList[i+1]||'';
      const wl = (i===moveList.length-1), bl = (i+1===moveList.length-1);
      html += `<span class="move-num">${num}.</span>`;
      html += `<span class="move-cell${wl?' latest':''}">${wm}</span>`;
      html += `<span class="move-cell${bl?' latest':''}">${bm}</span>`;
    }
    grid.innerHTML = html;
    grid.scrollTop = grid.scrollHeight;
  }

  function clearSquareHighlights() { $('#board .square-55d63').removeClass('last-move hint-square'); }
  function addSquareClass(sq,cls)   { $('#board .square-'+sq).addClass(cls); }

  function highlightLastMove() {
    if (!moveList.length) return;
    const last = moveList[moveList.length-1];
    if (last.length<4) return;
    addSquareClass(last.slice(0,2),'last-move');
    addSquareClass(last.slice(2,4),'last-move');
  }

  function highlightHint() {
    if (!hintMove||hintMove.length<4) return;
    addSquareClass(hintMove.slice(0,2),'hint-square');
    addSquareClass(hintMove.slice(2,4),'hint-square');
  }

  function promoSuffix(moving,to) {
    if (moving.t!=='p') return '';
    if (moving.c==='w'&&to.r===0) return 'q';
    if (moving.c==='b'&&to.r===7) return 'q';
    return '';
  }

  function updateEpTarget(moving,from,to) {
    epTarget = null;
    if (moving.t==='p'&&from.c===to.c&&Math.abs(to.r-from.r)===2)
      epTarget = {r:(from.r+to.r)>>1,c:from.c};
  }

  function handleSpecialMoves(moving,from,to) {
    if (moving.t==='k'&&Math.abs(to.c-from.c)===2) {
      const row=from.r;
      if (to.c===6) {
        const rf={r:row,c:7},rt={r:row,c:5};
        if (boardArray[rf.r][rf.c]?.t==='r') { boardArray[rt.r][rt.c]={...boardArray[rf.r][rf.c]}; boardArray[rf.r][rf.c]=null; }
      } else if (to.c===2) {
        const rf={r:row,c:0},rt={r:row,c:3};
        if (boardArray[rf.r][rf.c]?.t==='r') { boardArray[rt.r][rt.c]={...boardArray[rf.r][rf.c]}; boardArray[rf.r][rf.c]=null; }
      }
    }
    if (moving.t==='p') {
      const isDiag=from.c!==to.c, targEmpty=boardArray[to.r][to.c]==null;
      if (isDiag&&targEmpty&&epTarget&&epTarget.r===to.r&&epTarget.c===to.c) {
        const cap={r:moving.c==='w'?to.r+1:to.r-1,c:to.c};
        if (boardArray[cap.r]?.[cap.c]?.t==='p'&&boardArray[cap.r][cap.c]?.c!==moving.c)
          boardArray[cap.r][cap.c]=null;
      }
    }
  }

  function endGame({result='*',reason=null,pgn=null}={}) {
    if (clockTimer) { clearInterval(clockTimer); clockTimer=null; }
    started=false;
    boardDiv.classList.add('board-disabled');
    setThinking(false);
    thinkText.textContent='Game over';
    const labels={checkmate:'Checkmate',stalemate:'Stalemate','threefold repetition':'Draw · Threefold','insufficient material':'Draw · Material',draw:'Draw',timeout:'Timeout'};
    const title=labels[reason]||'Game Over';
    const banner=document.getElementById('gameBanner');
    banner.innerHTML=`<strong>${title}</strong> <span style="opacity:.5">·</span> ${result}`;
    banner.style.display='block';
    if (pgn) log('PGN:\n'+pgn);
    log(`[over] ${result}${reason?' · '+reason:''}`);
  }

  function startPosition() {
    setupStartBoardArray();
    turn='w'; moveList=[]; started=true;
    setThinking(false); epTarget=null; hintMove=null;
    boardDiv.classList.remove('board-disabled');
    document.getElementById('gameBanner').style.display='none';
    thinkText.textContent='';
    resetClocks();
    if (board) board.orientation(whiteAtBottom?'white':'black');
    syncBoardPosition();
  }

  function initBoard() {
    board = Chessboard('board', {
      draggable:     true,
      dropOffBoard:  'snapback',
      sparePieces:   false,
      orientation:   whiteAtBottom?'white':'black',
      pieceTheme:    './chessboardjs-1.0.0/img/chesspieces/wikipedia/{piece}.png',
      snapbackSpeed: 180,
      snapSpeed:     80,

      onDragStart(source,piece) {
        if (!started) return false;
        if (playAsSel.value!==turn) return false;
        const color=piece[0];
        if ((turn==='w'&&color!=='w')||(turn==='b'&&color!=='b')) return false;
        return true;
      },

      onDrop(source,target) {
        if (source===target) return 'snapback';
        return handlePlayerDrop(source,target);
      }
    });

    syncBoardPosition();
    window.addEventListener('resize',()=>board.resize());
  }

  async function handlePlayerDrop(source,target) {
    if (target==='offboard') return 'snapback';
    if (!started) return 'snapback';
    if (playAsSel.value!==turn) return 'snapback';
    if (source===target) return 'snapback';

    const from=parseSq(source), to=parseSq(target);
    const moving=boardArray[from.r]?.[from.c];
    const targetPiece=boardArray[to.r]?.[to.c];
    if (!moving) return 'snapback';
    if (moving.c!==turn) return 'snapback';
    if (targetPiece&&targetPiece.c===moving.c) return 'snapback';

    const uci=source+target+promoSuffix(moving,to);
    const prevBoard=boardArray.map(row=>row.map(c=>c?{...c}:null));
    const prevTurn=turn, prevMoves=moveList.slice();
    const prevEp=epTarget?{...epTarget}:null, prevHint=hintMove;

    boardArray[to.r][to.c]={...moving};
    boardArray[from.r][from.c]=null;
    if (uci[4]) boardArray[to.r][to.c].t=uci[4];
    handleSpecialMoves(moving,from,to);
    moveList.push(uci);
    turn=(turn==='w'?'b':'w');
    updateEpTarget(moving,from,to);
    hintMove=null;
    syncBoardPosition();

    if (currentGameId) {
      try {
        const r=await fetch(`/game/${currentGameId}/move`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uci})});
        if (!r.ok) {
          const err=await r.json().catch(()=>({}));
          boardArray=prevBoard; turn=prevTurn; moveList=prevMoves; epTarget=prevEp; hintMove=prevHint;
          syncBoardPosition(); log(`[illegal] ${uci} (${err.error||r.status})`); return 'snapback';
        }
        const jr=await r.json();
        if (jr.over) { endGame({result:jr.result,reason:jr.reason,pgn:jr.pgn}); return; }
      } catch(e) {
        boardArray=prevBoard; turn=prevTurn; moveList=prevMoves; epTarget=prevEp; hintMove=prevHint;
        syncBoardPosition(); log(`[error] ${e?.message||e}`); return 'snapback';
      }
    }

    if (playAsSel.value!==turn) engineMove();
  }

  async function applyEngineBestmove(uci) {
    if (!uci||uci.length<4) return;
    const from=parseSq(uci.slice(0,2)), to=parseSq(uci.slice(2,4));
    const moving=boardArray[from.r]?.[from.c];
    if (!moving) { log(`[engine] no piece at ${uci.slice(0,2)}`); return; }
    const moved={...moving};
    if (uci[4]) moved.t=uci[4];
    boardArray[to.r][to.c]=moved;
    boardArray[from.r][from.c]=null;
    handleSpecialMoves(moving,from,to);
    moveList.push(uci);
    turn=(turn==='w'?'b':'w');
    updateEpTarget(moving,from,to);
    hintMove=null;
    syncBoardPosition();
    log(`[engine] ${uci}`);

    if (currentGameId) {
      try {
        const r=await fetch(`/game/${currentGameId}/move`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uci})});
        if (!r.ok) { const e=await r.json().catch(()=>({})); log(`[engine persist] ${e.error||r.status}`); return; }
        const jr=await r.json();
        if (jr.over) endGame({result:jr.result,reason:jr.reason,pgn:jr.pgn});
      } catch(e) { log(`[engine persist] ${e?.message||e}`); }
    }
  }

  async function engineMove() {
    if (!started) return;
    setThinking(true);
    try {
      try {
        const br=await fetch('/bookmove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({moves:moveList})});
        const b=await br.json();
        if (b.bookmove) { setThinking(false); await applyEngineBestmove(b.bookmove); log(`[book] ${b.bookmove}`); return; }
      } catch(_) {}

      const depth=depthEl.value?Number(depthEl.value):null;
      const diff=Number(diffRange.value||2);
      const diffMs=[250,500,1000,2000,4000][diff-1];
      const mtMs=depth?Number(msEl.value||500):diffMs;

      const r=await fetch('/bestmove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({moves:moveList,movetimeMs:mtMs,depth:depth||null,wtime:clocks.w,btime:clocks.b,winc:0,binc:0})});
      const data=await r.json();
      setThinking(false);
      if (data.bestmove) await applyEngineBestmove(data.bestmove);
      else log(`[engine error]\n${data.raw||''}`);
    } catch(e) { setThinking(false); log('fetch /bestmove failed: '+(e?.message||e)); }
  }

  async function requestHint() {
    if (!started) return;
    setThinking(true);
    try {
      const depth=depthEl.value?Number(depthEl.value):null;
      const diff=Number(diffRange.value||2);
      const diffMs=[250,500,1000,2000,4000][diff-1];
      const mtMs=depth?Number(msEl.value||500):Math.min(diffMs,1000);

      const r=await fetch('/bestmove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({moves:moveList,movetimeMs:mtMs,depth:depth||null,wtime:clocks.w,btime:clocks.b,winc:0,binc:0})});
      const data=await r.json();
      setThinking(false);
      if (data.bestmove) { hintMove=data.bestmove; syncBoardPosition(); log(`[hint] ${data.bestmove}`); }
      else log(`[hint error]\n${data.raw||''}`);
    } catch(e) { setThinking(false); log('hint failed: '+(e?.message||e)); }
  }

  document.getElementById('new').onclick = async () => {
    try {
      const r=await fetch('/game/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({time_control:'300+0'})});
      const g=await r.json(); currentGameId=g.gameId||null;
    } catch(_) { currentGameId=null; }
    whiteAtBottom=(playAsSel.value==='w');
    startPosition();
    if (playAsSel.value==='b') engineMove();
  };

  document.getElementById('flip').onclick = () => {
    whiteAtBottom=!whiteAtBottom;
    if (board) board.orientation(whiteAtBottom?'white':'black');
    syncBoardPosition();
  };

  document.getElementById('engineMove').onclick = () => {
    if (started&&playAsSel.value!==turn) engineMove();
  };

  document.getElementById('finish').onclick = async () => {
    if (!started) { log('No active game.'); return; }
    if (!currentGameId) { endGame({result:'*',reason:'draw'}); log('Ended locally.'); return; }
    try {
      const r=await fetch(`/game/${currentGameId}/finish`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({result:'*'})});
      const data=await r.json();
      endGame({result:data.result||'*',reason:data.reason||'draw',pgn:data.pgn||null});
    } catch(e) { log('finish failed: '+(e?.message||e)); }
  };

  document.getElementById('hintBtn').onclick = () => {
    if (!started) { log('Start a game first.'); return; }
    requestHint();
  };

  diffRange.addEventListener('input', () => { diffLabel.textContent=`${diffRange.value}/5`; });

  window.addEventListener('keydown', e => {
    if (e.key==='n'||e.key==='N') document.getElementById('new').click();
    if (e.key==='f'||e.key==='F') document.getElementById('flip').click();
    if (e.key==='e'||e.key==='E') document.getElementById('engineMove').click();
  });

  setupStartBoardArray();
  initBoard();
  syncBoardPosition();
</script>
</body>
</html>
